name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Placeholder secrets (fork-safe)
        run: cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig

      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace SmartTube.xcworkspace \
            -scheme SmartTube \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SmartTube.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/SmartTube.xcarchive/Products/Applications/SmartTube.app" build/Payload/
          cd build
          zip -qr SmartTube-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-unsigned-ipa
          path: build/SmartTube-unsigned.ipa
          retention-days: 30
