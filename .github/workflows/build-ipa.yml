name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6.0)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace SmartTube.xcworkspace \
            -scheme 'SmartTube' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SmartTube.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/SmartTube.xcarchive/Products/Applications/SmartTube.app" build/Payload/
          cd build
          zip -qr SmartTube-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-unsigned-ipa
          path: build/SmartTube-unsigned.ipa
          retention-days: 30
