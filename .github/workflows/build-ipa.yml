name: Build iPhone IPA

on:
  workflow_dispatch:        # กดรันเองได้จากหน้า Actions
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-14       # เครื่อง macOS พร้อม Xcode (ฟรีสำหรับ repo public)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: xcodebuild -version

      # Archive แอปแบบไม่เซ็น (unsigned) — เอาไป sign ทีหลังได้
      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace SmartTube.xcworkspace \
            -scheme 'Smart Tube' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SmartTube.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # แพ็ก .app เป็น .ipa (วิธี manual — ใช้ได้กับ unsigned build)
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/SmartTube.xcarchive/Products/Applications/Smart Tube.app" build/Payload/
          cd build
          zip -qr SmartTube-unsigned.ipa Payload

      # อัปโหลด .ipa ให้กดดาวน์โหลดได้จากหน้า Actions → Artifacts
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-unsigned-ipa
          path: build/SmartTube-unsigned.ipa
          retention-days: 30
